packages:
  - '.'
  - 'console'

# pnpm installs no release younger than one day. It is pnpm 11's default too,
# and stated here so the gate rests on this file. Dependabot's cooldown in
# `.github/dependabot.yml` waits past it.
minimumReleaseAge: 1440

# Build scripts pnpm may run during install.
#
# pnpm blocks lifecycle scripts by default. Each package below is a real
# transitive dependency that needs one, so removing an entry makes the
# install skip that build:
#
#   esbuild        vitest's bundler
#
# Three entries read `false`: protobufjs, ssh2 and cpu-features. All three exist
# for `testcontainers` alone, which is a development dependency that 95 packages
# hang off and which a run naming DATABASE_URL and MAIL_HOST never loads.
#
# Declined rather than deleted. A resolved package with a build script and no
# entry makes `pnpm install` exit 1 with ERR_PNPM_IGNORED_BUILDS, and `pnpm
# exec` re-runs install, so every command in this repository fails. `false`
# says the skip is a decision.
#
# Nothing is lost by skipping them. protobufjs's script is a no-op in v7,
# cpu-features is ssh2's optional accelerator, and ssh2 falls back to its own
# JavaScript implementation. The throwaway container path was run with all
# three unbuilt.
#
# The repository is a workspace since the console arrived. `console/` is the
# operator console, and it is a separate package for one reason: DEC-11 keeps
# the core free of a new interface, and a package boundary is the only way to
# state that a console dependency can never reach the daemons. The core `build`,
# `lint` and `test` targets cover `src/` alone, so the console package adds
# nothing to any of them.
allowBuilds:
  esbuild: true
  protobufjs: false
  ssh2: false
  cpu-features: false

# Security floors for transitive dependencies. vitest pulls vite, and imapflow
# pulls ip-address through socks; both ranges admit the patched releases, and
# these floors keep a re-resolve from landing on a vulnerable one.
#
#   vite        >=8.3.3  GHSA-9jrq-w75r-8gcw, GHSA-rq7h-c2jc-7f22 and the
#                        bundled launch-editor advisories. vitest 5.1 types
#                        need vite 8, so the floor is the patched 8.x release.
#   ip-address  >=10.7.4 GHSA-rxp7-6hxx-x8q5
#   minimatch   >=11.0.1 GHSA-g3hv-75wg-m249. eslint and testcontainers pull
#                        7.x to 10.x, and only 11.0.1 carries the fix.
#   glob        >=14.0.2 GHSA-3g3m-2fjr-6pw4. testcontainers pulls 10.x through
#                        archiver, and only 14.0.2 carries the fix.
overrides:
  vite: '>=8.3.3 <9'
  ip-address: '>=10.7.4 <11'
  minimatch@>=7.0.0 <11.0.1: '>=11.0.1 <12'
  glob@>=9.0.0 <14.0.2: '>=14.0.2 <15'
