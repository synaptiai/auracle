packages:
  - '.'
  - 'console'

# pnpm installs no release younger than one day. It is pnpm 11's default too,
# and stated here so the gate rests on this file. Dependabot's cooldown in
# `.github/dependabot.yml` waits past it.
minimumReleaseAge: 1440

# Build scripts pnpm may run during install.
#
# pnpm blocks lifecycle scripts by default. Each package below is a real
# transitive dependency that needs one, so removing an entry makes the
# install skip that build:
#
#   esbuild        vitest's bundler
#
# Three entries read `false`: protobufjs, ssh2 and cpu-features. All three
# exist for `testcontainers` alone, which is a development dependency that 95
# packages hang off and which a run naming DATABASE_URL and MAIL_HOST never
# loads (issue #80).
#
# Declined rather than deleted. A resolved package with a build script and no
# entry makes `pnpm install` exit 1 with ERR_PNPM_IGNORED_BUILDS, and `pnpm
# exec` re-runs install, so every command in this repository fails. `false`
# says the skip is a decision.
#
# Nothing is lost by skipping them. protobufjs's script is a no-op in v7,
# cpu-features is ssh2's optional accelerator, and ssh2 falls back to its own
# JavaScript implementation. The throwaway container path was run with all
# three unbuilt.
#
# The repository is a workspace since issue #27. `console/` is the operator
# console, and it is a separate package for one reason: DEC-11 keeps the core
# free of a new interface, and a package boundary is the only way to state
# that a console dependency can never reach the daemons. The core `build`,
# `lint` and `test` targets cover `src/` alone, so the console package adds
# nothing to any of them.
allowBuilds:
  esbuild: true
  protobufjs: false
  ssh2: false
  cpu-features: false
