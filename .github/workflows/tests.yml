# CI for the command contract in CONTRIBUTING.md.
#
# Three jobs, split by what each needs. Wall time is the slowest job, not the
# sum: `fast` starts no service and answers in well under a minute, `db` waits
# on Postgres and GreenMail, `console` needs neither. Before the split one
# sequential job ran everything, and every step waited on the 3-minute test
# step for no reason.
#
# Each job names a target from package.json and nothing else, so a contributor
# runs the same command and sees the same result. `pnpm run verify` is still
# the whole contract and still the one command CONTRIBUTING.md asks for; these
# three cover the same ground between them.
#
# The database is the same pgvector Postgres the compose stack runs
# (docker-compose.yml): user, password and db name auracle. Each suite applies
# the real schema through src/test-support/schema.ts, which walks every file
# under db/ in version order, so no migration step is needed here.
#
# DATABASE_URL and MAIL_HOST are set on the db job, so the global setups probe
# them before the workers fork and fail the job when either service is
# unreachable. Without those probes the suites would skip themselves and the
# job would still pass. Both services are declared below rather than started
# through testcontainers inside the test step, so they boot alongside checkout
# and the runner's Docker socket is never used.
#
# The unit project overrides DATABASE_URL with a refusing address of its own,
# so a pure suite cannot reach a real database even here
# (see src/test-support/projects.ts).
name: Tests

# No path filter. The unit and database suites read shipped prose, so a
# change to markdown alone can fail them.
on:
  pull_request:

# A superseded push cancels the run it replaced. Two runs on one branch 37
# seconds apart both ran to completion before this.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job only reads the repository.
permissions:
  contents: read

jobs:
  # Types, lint, the pure suite, the documentation and style checks, the guard
  # self-tests and the fixtures diff. No service, no Docker socket.
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.20.0
      # `.nvmrc` names the Node major. engines requires 22.13 or later.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify (no database)
        run: pnpm run verify:fast

  # The database and mail suites, against service containers.
  db:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: auracle
          POSTGRES_PASSWORD: auracle
          POSTGRES_DB: auracle
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U auracle -d auracle"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # GreenMail used to start through testcontainers inside the test step,
      # so the JVM's boot sat on the critical path and the job needed a Docker
      # socket. As a service it starts alongside checkout and install.
      #
      # The health check names bash explicitly. The image holds no curl, no nc
      # and no wget, so `/dev/tcp` is the only way to test its own IMAP port —
      # and that is a bash feature, while `--health-cmd "sh -c ..."` runs
      # dash. The first version of this file used `sh`, the check could never
      # pass, and the job failed on `unhealthy` while the server was serving
      # correctly. Verified both ways against a running container: the open
      # port exits 0 and a closed one exits 1.
      mail:
        image: greenmail/standalone:2.1.12
        env:
          GREENMAIL_OPTS: -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
        ports:
          - "3025:3025"
          - "3143:3143"
        options: >-
          --health-cmd "bash -c 'echo > /dev/tcp/127.0.0.1/3143'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 24

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.20.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Database and mail suites
        run: pnpm run verify:db
        env:
          DATABASE_URL: postgres://auracle:auracle@localhost:5433/auracle
          MAIL_HOST: 127.0.0.1
          MAIL_SMTP_PORT: "3025"
          MAIL_IMAP_PORT: "3143"

  # The console is its own package. It needs the core built first, because it
  # imports the core's compiled output.
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.20.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the core
        run: pnpm run build
      - name: Console build, types and tests
        run: pnpm run verify:console
