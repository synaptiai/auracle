# CI for the command contract in CONTRIBUTING.md: `pnpm run verify` must exit 0
# on every pull request.
#
# The steps below name targets from package.json and nothing else. A
# contributor runs the same target locally and sees the same result, so the
# workflow and the documents cannot drift into disagreeing about what a green
# pull request means.
#
# The database is the same pgvector Postgres the compose stack runs
# (docker-compose.yml): user, password and db name auracle. Each suite applies
# the real schema through src/test-support/schema.ts, which walks every file
# under db/ in version order, so no migration step is needed here.
#
# DATABASE_URL is set below, so the db project's global setup probes it before
# the workers fork and fails this job when the service is unreachable. Without
# that probe every database suite would skip itself and the job would still
# pass. The unit project overrides it with a refusing address of its own, so a
# pure suite cannot reach this service (see src/test-support/projects.ts).
name: Tests

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: auracle
          POSTGRES_PASSWORD: auracle
          POSTGRES_DB: auracle
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U auracle -d auracle"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # engines requires Node >= 22.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build, types, lint, every test project, the console's three targets,
      # the documentation checks, the style check, the guard self-tests and
      # the fixtures diff. The same command CONTRIBUTING.md asks for.
      - name: Verify
        run: pnpm run verify
        env:
          DATABASE_URL: postgres://auracle:auracle@localhost:5433/auracle
