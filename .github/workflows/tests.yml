# CI for the command contract in AGENTS.md: build, test and lint must all
# pass with exit code 0 on every pull request.
#
# The database is the same pgvector Postgres the compose stack runs
# (docker-compose.yml): user, password and db name auracle. Each suite applies
# the real schema through src/test-support/schema.ts, which walks every file
# under db/ in version order, so no migration step is needed here.
#
# DATABASE_URL is set below, so the global setup probes it before the workers
# fork and fails this job when the service is unreachable. Without that probe
# every database suite would skip itself and the job would still pass.
name: Tests

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: auracle
          POSTGRES_PASSWORD: auracle
          POSTGRES_DB: auracle
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U auracle -d auracle"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # engines requires Node >= 22.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgres://auracle:auracle@localhost:5433/auracle

      - name: Lint
        run: pnpm run lint

      # The console is its own package, so the core targets above do not
      # reach it: `pnpm test` excludes `console/**` to keep the core counts
      # where they were, and tsconfig.check.json covers `src/` alone. Without
      # these three steps the console's build, its types and its cases run
      # nowhere on a pull request — and `docs/operations.md` cites
      # select-only.test.ts in print as the proof of the single-write claim.
      # A proof that never executes is not one.
      - name: Console build
        run: pnpm --filter @auracle/console build

      - name: Console types
        run: pnpm --filter @auracle/console check

      - name: Console test
        run: pnpm --filter @auracle/console test

      # DEC-18: the committed corpus must match what the generator writes.
      # Running the generator and eyeballing it is circular. The diff is the
      # part that can fail.
      - name: Fixtures match the generator (DEC-18)
        run: |
          node scripts/generate-fixtures.mjs
          git diff --exit-code fixtures/
