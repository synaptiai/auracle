# A merge to main builds one image and pushes it to GHCR.
#
# The image is tagged with the commit SHA, so every commit on main has a named
# build and a rollback is a tag change. The tag reaches the registry only
# after the image passes its check. This workflow deploys nowhere: an adopter
# pulls the image into their own stack (DEC-17, DEC-19).
name: Release

on:
  push:
    branches: [main]
  # Re-run the build for the tip of main by hand.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  image:
    # main alone: a dispatch from another branch would push that branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A group for each commit. GitHub keeps one waiting run per group and
    # cancels it when a newer one queues, so a group shared by the branch
    # would skip a commit. Each commit pushes its own tag, so two builds do
    # not collide.
    concurrency:
      group: image-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: meta
        # The SHA, not `latest`. A tag that moves cannot be rolled back to,
        # and a host that pulls `latest` cannot say what it is running.
        run: echo "tag=${REGISTRY}/${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The build loads the image into the runner's Docker, not the
      # registry. The last step pushes the tag, after the check passes.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tag }}
          # The runner's cache, so a second build reuses the install layer.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The build proves the image compiles, not that a process starts. A
      # missing file fails at runtime. So before the workflow publishes the
      # image, the image names its processes. It also holds the module each
      # one runs, the migrations, the intent taxonomy and the product list.
      # The modules come from the entrypoint itself, so that list cannot
      # drift from what the image runs.
      - name: The image names its processes
        run: |
          set -eu
          out=$(docker run --rm "${{ steps.meta.outputs.tag }}" 2>&1 || true)
          for process in webhook imap consumer relay console migrate; do
            echo "$out" | grep -q "^  $process " || {
              echo "the image's usage does not name '$process'" >&2
              echo "$out" >&2
              exit 1
            }
          done
          echo "$out"
          docker run --rm --entrypoint sh "${{ steps.meta.outputs.tag }}" -c '
            set -eu
            modules=$(grep -o "/app/[^ ]*\.js" /usr/local/bin/entrypoint.sh)
            [ -n "$modules" ] || { echo "the entrypoint names no module" >&2; exit 1; }
            for file in $modules /app/fixtures/taxonomy.json /app/products.json; do
              [ -f "$file" ] || { echo "the image lacks $file" >&2; exit 1; }
            done
            ls /app/db/*.sql >/dev/null 2>&1 || { echo "the image lacks the migrations in /app/db" >&2; exit 1; }
            echo "the image holds each module, the migrations, the taxonomy and the product list"
          '

      - name: Publish the image
        run: docker push "${{ steps.meta.outputs.tag }}"

  # A dispatch from another branch runs no build. This job says so and fails,
  # so the run does not read as a build that passed.
  not-main:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Refuse a branch other than main
        run: |
          echo "The release workflow builds main alone. Dispatch it from main." >> "$GITHUB_STEP_SUMMARY"
          exit 1
