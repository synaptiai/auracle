name: Guardrails

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request cancels the run it replaces. On main each
# commit has a group of its own, as in tests.yml, so every merge has a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job only reads the repository.
permissions:
  contents: read

jobs:
  validators:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The two range checks below are the only ones scoped to the commits a
      # run adds rather than to the tree, so they cannot be plain `pnpm run`
      # targets: they need a base commit, which only the event names. Everything
      # else this job runs is also in `pnpm run verify`, deliberately: this job
      # answers in about fifteen seconds and that one takes minutes.
      #
      # A pull request compares with its base. A push to main compares with the
      # commit main held before it. Both checks refuse a range they cannot
      # read, so a missing base fails the job rather than passing it unread.
      - name: The commits this run adds
        id: range
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          case "$base" in
            ""|0000000000000000000000000000000000000000)
              echo "this event names no base commit to compare with" >&2
              exit 1 ;;
          esac
          # A commit id is 40 hex characters. Anything else is not one, so it
          # never reaches a command line below.
          if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]]; then
            echo "the base '$base' is not a commit id" >&2
            exit 1
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      # `base...head` reads the files the run changes since the merge base.
      - name: Synthetic fixture rule (DEC-18)
        env:
          BASE: ${{ steps.range.outputs.base }}
        run: scripts/check-changed-pii.sh "$BASE...$GITHUB_SHA"

      - name: Synthetic-fixture guard cases (DEC-18)
        run: python3 .claude/hooks/test_fixtures_pii_guard.py

      # `base..head` lists the commits the run adds, and no commit the base
      # holds alone.
      - name: DEC citation on register changes (section 2)
        env:
          BASE: ${{ steps.range.outputs.base }}
        run: python3 .claude/hooks/commit_dec_citation.py "--range=$BASE..$GITHUB_SHA"

      - name: Live-database guard cases (DEC-17, DEC-19)
        run: python3 .claude/hooks/test_live_db_approval.py

      - name: DEC-citation guard cases (section 2)
        run: python3 .claude/hooks/test_commit_dec_citation.py

      # Rules 1 and 2 of the style convention only. Rules 3 to 5 need a
      # reader, and no checker claims them. The file list lives in
      # SHIPPED_GLOBS inside the checker and nowhere else, so this step names
      # no files, and the list cannot drift away from `pnpm run check:ste`.
      - name: Simplified Technical English (rules 1 and 2)
        run: python3 scripts/ste-check.py

      - name: STE checker cases
        run: python3 scripts/test_ste_check.py

      # A document drifts quietly. These checks decide the claims a machine
      # can decide: every diagram box is declared and explained, the parked
      # reply reaches a person through the adapter, every linked file
      # exists, section 7.1 accounts for every open item, and every design
      # record declares a decision the register defines.
      - name: Documentation claims (diagrams, links, design index, design records)
        run: python3 scripts/check-docs.py

      - name: Documentation checker cases
        run: python3 scripts/test_check_docs.py

      # The live-database rule blocks inside a session only. The step above
      # tests its logic, and it does not enforce the rule on a pull request.
      # REVIEW.md holds the test-edit rule, and no hook enforces it. The
      # commit-msg hook covers the citation rule locally: hooks/commit-msg
      # says how to install it.
