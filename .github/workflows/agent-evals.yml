name: Agent evals

on:
  push:
    paths:
      - "CLAUDE.md"
      - ".claude/**"
      - "evals/**"
      - ".github/workflows/agent-evals.yml"
  workflow_dispatch:
    inputs:
      behaviour:
        description: "Run the behaviour layer. It spends model calls."
        type: boolean
        default: false

# Every job only reads the repository.
permissions:
  contents: read

jobs:
  structural-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Structural validation of the eval suite
        run: python3 evals/run.py

  # The behaviour layer spends model calls, and it greps the agent's stdout
  # rather than the repository. The fixture-PII case therefore passes when an
  # agent writes the file and prints "Done." A nightly cron paid for that.
  # It stays opt-in until the cases assert against the tree; evals/run.py
  # holds the same gate for a local run.
  behaviour-evals:
    if: inputs.behaviour
    # Needs the Claude CLI and a key. Runs after the structural layer passes.
    needs: structural-checks
    runs-on: ubuntu-latest
    env:
      EVAL_AGENT_CMD: ${{ vars.EVAL_AGENT_CMD }}
      EVAL_BEHAVIOUR: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # An exact version, so a new release cannot change what runs here. The
      # key is not in this step's environment, so no install script sees it.
      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.289
      - name: Run behaviour cases
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 evals/run.py
