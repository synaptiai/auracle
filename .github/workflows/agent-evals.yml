name: Agent evals

on:
  push:
    paths:
      - "CLAUDE.md"
      - ".claude/**"
      - "evals/**"
      - ".github/workflows/agent-evals.yml"
  workflow_dispatch:
    inputs:
      behaviour:
        description: "Run the behavior layer. It spends model calls."
        type: boolean
        default: false

# Every job only reads the repository.
permissions:
  contents: read

jobs:
  structural-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Structural validation of the eval suite
        run: python3 evals/run.py

  # The behavior layer spends model calls, and it greps the agent's stdout
  # rather than the repository. The fixture-PII case therefore passes when an
  # agent writes the file and prints "Done." A nightly cron paid for that.
  # It stays opt-in until the cases assert against the tree; evals/run.py
  # holds the same gate for a local run.
  behaviour-evals:
    if: inputs.behaviour
    # Needs the Claude CLI and a key. Runs after the structural layer passes.
    needs: structural-checks
    runs-on: ubuntu-latest
    env:
      EVAL_AGENT_CMD: ${{ vars.EVAL_AGENT_CMD }}
      EVAL_BEHAVIOUR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # An exact version, so a new release cannot change what runs here. The
      # key is not in this step's environment, so no install script sees it.
      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.289
      - name: Run behavior cases
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 evals/run.py
