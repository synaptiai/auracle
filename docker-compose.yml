services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: auracle
      POSTGRES_PASSWORD: auracle
      POSTGRES_DB: auracle
    ports:
      # Host 5432 is occupied by another local stack (nci-postgres).
      - "5433:5432"
    volumes:
      - auracle-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auracle -d auracle"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  auracle-db-data:
