services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: auracle
      # Read once, when Postgres first creates its data volume. Set
      # AURACLE_DB_PASSWORD in the host's .env before the first `up`.
      POSTGRES_PASSWORD: ${AURACLE_DB_PASSWORD:-auracle}
      POSTGRES_DB: auracle
    ports:
      # Loopback, and deliberately. This file is the ledger for a checkout,
      # and `docker-compose.dev.yml` extends it onto a host — where an
      # unqualified mapping publishes the whole ledger on every interface,
      # behind the compose default password below. A docker publish inserts
      # into the DOCKER chain, so a host firewall does not cover it. Nothing
      # needs the port off-box: a checkout reaches localhost and the stack's
      # own services reach `db` over the compose network on 5432.
      #
      # The default is 5433, not 5432, because 5432 was occupied by another
      # local stack on the machine this file was written on. That is one
      # developer's fact, so it is a default and not a constant: set
      # AURACLE_DB_PORT to move it.
      - "127.0.0.1:${AURACLE_DB_PORT:-5433}:5432"
    volumes:
      - auracle-db-data:/var/lib/postgresql/data
    # The readers' role logs in to the ledger and to no other database
    # (issue #153). Its rights are taken in the ledger's database only, and
    # a login to `postgres` would get PUBLIC's there. The file lives outside
    # the data directory, so an existing volume takes it at its next start.
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    configs:
      - source: pg_hba
        target: /etc/postgresql/pg_hba.conf
    # Over TCP. On a new volume the image first runs a setup server that
    # listens on the socket alone, then stops it. A socket probe passes during
    # setup, and a migration then meets a server that is shutting down.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U auracle -d auracle"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The mail server the mail suites drive (issue #80). Test-only: see the
  # profile below.
  #
  # `src/test-support/containers.ts` already honours MAIL_HOST the way it
  # honours DATABASE_URL: set it, and the setup probes that server instead of
  # starting a throwaway container. Nothing provided one, so the only local
  # path was testcontainers, which costs 95 packages and three native build
  # allowances on every install.
  #
  # The tag is pinned and must match the one in `containers.ts` and in
  # `.github/workflows/tests.yml`. Three copies of a version is two too many,
  # and a floating tag is a test suite that changes under you.
  #
  # `greenmail.auth.disabled` accepts any credentials, and the setup invents a
  # mailbox per suite. That is right for a server that holds synthetic mail
  # only (DEC-18) and reachable from loopback alone.
  mail:
    # Behind a profile, so it starts for a test run and for nothing else.
    #
    # `.github/workflows/release.yml` deploys with
    # `-f docker-compose.yml -f docker-compose.dev.yml up -d`, which starts
    # every service the merged file declares. Without this the dev host ran a
    # mail server that accepts any credentials for any account, reachable by
    # every local process and every container on the compose network. The
    # `imap` service in the dev overlay is gated the same way and for a
    # related reason.
    #
    # So the local test command names the profile:
    #
    #   docker compose --profile test up -d --wait
    #
    # `db` carries no profile, so it starts either way.
    profiles: [test]
    image: greenmail/standalone:2.1.12
    environment:
      GREENMAIL_OPTS: -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
    ports:
      # Loopback, for the reason the ledger above gives. An open SMTP port is
      # worse than an open database: it is a relay.
      - "127.0.0.1:${AURACLE_SMTP_PORT:-3025}:3025"
      - "127.0.0.1:${AURACLE_IMAP_PORT:-3143}:3143"
    healthcheck:
      # The JVM answers IMAP last, so a TCP probe of 3143 is the readiness
      # signal. `awaitMailReady` in `containers.ts` waits on the same port.
      #
      # `bash -c`, not CMD-SHELL. `/dev/tcp` is a bash builtin and CMD-SHELL
      # runs `/bin/sh`, which is dash in this image: the probe failed with
      # "cannot create /dev/tcp/..." on every interval and the service read
      # `unhealthy` while answering IMAP perfectly. The image ships bash, and
      # `.github/workflows/tests.yml` spells the same probe the same way.
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/3143"]
      interval: 5s
      timeout: 3s
      retries: 24

volumes:
  auracle-db-data:

configs:
  # The first line that matches decides. The readers' role's lines come first, so
  # the trust lines below never admit it. The pattern admits the databases a
  # test run clones. The rest is the image's own file.
  pg_hba:
    content: |
      local       auracle,/^auracle_(clone|tmpl)_  auracle_reader        scram-sha-256
      host        auracle,/^auracle_(clone|tmpl)_  auracle_reader  all   scram-sha-256
      local       all         auracle_reader              reject
      host        all         auracle_reader  all         reject
      local       all         all                     trust
      host        all         all     127.0.0.1/32    trust
      host        all         all     ::1/128         trust
      local       replication all                     trust
      host        replication all     127.0.0.1/32    trust
      host        replication all     ::1/128         trust
      host        all         all     all             scram-sha-256
